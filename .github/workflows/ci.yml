# Continuous integration (docs/DEPLOYMENT_AND_OPERATIONS.md §4, Phase 1 task 8).
# Runs on every push to staging and on pull requests into staging or main.
# Needs no secrets: database tests run migrations and pgTAP in PGlite (in-process Postgres).
name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, unit + database tests, build, bundle check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint (includes the service-role allow-list rule)
        run: npm run lint
      - name: Unit tests
        run: npx vitest run --project unit
      - name: Database tests (all migrations + pgTAP, incl. "every table has RLS" and tenant isolation)
        run: npx vitest run --project db
      - name: Build
        run: npm run build
      - name: Client bundle contains no service-role key
        run: npm run check:bundle
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Browser tests (desktop + mobile, accessibility)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks (whole history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: npm audit (production dependencies, high severity fails)
        run: npm audit --omit=dev --audit-level=high
